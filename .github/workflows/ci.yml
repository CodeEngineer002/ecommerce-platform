name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. TypeScript type-check
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Unit + Integration tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: TestShop
      NEXT_PUBLIC_PAYMENT_PROVIDER: stripe
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Build verification
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit]
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: ShopNest
      NEXT_PUBLIC_PAYMENT_PROVIDER: stripe
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. E2E tests (only on main / PRs targeting main)
  # ─────────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    env:
      # App
      NEXT_PUBLIC_APP_URL: http://localhost:4000
      NEXT_PUBLIC_APP_NAME: ShopNest
      E2E_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_PAYMENT_PROVIDER: cod
      # Supabase — set via repository secrets for CI
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # E2E test credentials — set via repository secrets
      TEST_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      TEST_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      TEST_LOCALE_PREFIX: /in/en
      TEST_COUNTRY_CODE: IN
      TEST_PRODUCT_SLUG: wireless-noise-cancelling-headphones
      E2E_ALLOW_PRODUCTION: ${{ secrets.E2E_ALLOW_PRODUCTION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate E2E environment
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ E2E_SUPABASE_URL secret is not set. E2E tests require a test database."
            exit 1
          fi
          echo "✅ E2E environment variables present"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      - name: Create .playwright directory
        run: mkdir -p .playwright

      - name: Run E2E regression tests
        run: npm run test:e2e:regression
        env:
          CI: "true"

      - name: Run full E2E suite
        run: npm run test:e2e -- --project=chromium
        env:
          CI: "true"
        continue-on-error: true   # upload report even on failure

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/tests/e2e/reports/html/
          retention-days: 7

      - name: Upload Playwright JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-junit
          path: src/tests/e2e/reports/results.xml
          retention-days: 7

      - name: Upload test artifacts (screenshots/traces/videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: src/tests/e2e/reports/artifacts/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Migration validation (verify SQL migrations are valid)
  # ─────────────────────────────────────────────────────────────────────────────
  validate-migrations:
    name: Validate DB Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration file naming convention
        run: |
          # Verify all migration files follow the {NNNNN}_description.sql pattern
          for f in supabase/migrations/*.sql; do
            filename=$(basename "$f")
            if ! echo "$filename" | grep -qE '^[0-9]{5}_[a-z0-9_]+\.sql$'; then
              echo "❌ Invalid migration filename: $filename (expected NNNNN_description.sql)"
              exit 1
            fi
          done
          echo "✅ All migration files follow naming convention"

      - name: Check for duplicate migration numbers
        run: |
          nums=$(ls supabase/migrations/*.sql | xargs -I{} basename {} | grep -oE '^[0-9]+' | sort)
          dupes=$(echo "$nums" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "❌ Duplicate migration numbers detected: $dupes"
            exit 1
          fi
          echo "✅ No duplicate migration numbers"
